<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf8ff" id="theme-color">
    <title>ZuraTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
    <script>
        /* Runs before the first paint so a saved dark theme never flashes white. */
        (function () {
            try {
                var choice = localStorage.getItem("zuratasks.theme");
                var dark = choice
                    ? choice === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            } catch (err) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
</head>
<body>
    <main class="app">
        <header class="app__header">
            <div class="app__brand">
                <span class="app__logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4.5 12.5l4.8 4.8L19.5 7"></path>
                    </svg>
                </span>
                <h1 class="app__title">ZuraTasks</h1>
            </div>

            <div class="app__meta">
                <p class="app__count" id="count" aria-live="polite">No tasks yet</p>
                <div class="progress" id="progress" role="progressbar" hidden
                     aria-label="Tasks completed" aria-valuemin="0"
                     aria-valuemax="0" aria-valuenow="0">
                    <span class="progress__bar" id="progress-bar"></span>
                </div>
            </div>

            <button class="theme-toggle" id="theme-toggle" type="button"
                    aria-pressed="false" aria-label="Switch to dark mode"
                    title="Switch to dark mode">
                <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
                </svg>
                <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"></path>
                </svg>
            </button>
        </header>

        <form class="add" id="add-form" autocomplete="off">
            <input
                class="add__input"
                id="add-input"
                type="text"
                name="title"
                placeholder="Add a task&hellip;"
                maxlength="200"
                aria-label="New task title">
            <select class="add__select" id="add-priority" aria-label="Priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
            </select>
            <input class="add__date" id="add-due" type="date" aria-label="Due date">
            <button class="add__btn" type="submit">Add</button>
        </form>

        <p class="error" id="error" role="alert" hidden></p>

        <nav class="controls" aria-label="Filter and search tasks">
            <div class="tabs" id="tabs" role="group" aria-label="Filter tasks">
                <button class="tab tab--active" type="button" data-filter="all"
                        aria-pressed="true">All</button>
                <button class="tab" type="button" data-filter="today"
                        aria-pressed="false">Today</button>
                <button class="tab" type="button" data-filter="upcoming"
                        aria-pressed="false">Upcoming</button>
                <button class="tab" type="button" data-filter="done"
                        aria-pressed="false">Done</button>
            </div>
            <div class="search">
                <svg class="search__icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="M16 16l4.5 4.5"></path>
                </svg>
                <input class="search__input" id="search" type="search"
                       placeholder="Search tasks&hellip;" autocomplete="off"
                       aria-label="Search tasks by title">
            </div>
        </nav>

        <div class="layout">
            <section class="card calendar" aria-label="Due date calendar">
                <header class="calendar__head">
                    <button class="icon-btn" id="prev-month" type="button"
                            aria-label="Previous month">&lsaquo;</button>
                    <h2 class="calendar__title" id="calendar-title">&nbsp;</h2>
                    <button class="icon-btn" id="next-month" type="button"
                            aria-label="Next month">&rsaquo;</button>
                </header>
                <div class="calendar__weekdays" aria-hidden="true">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
                    <span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div class="calendar__grid" id="calendar-grid"></div>
                <button class="calendar__clear" id="clear-filter" type="button" hidden></button>
            </section>

            <section class="groups" aria-label="Tasks by priority">
                <div id="groups"></div>
                <p class="empty" id="empty" hidden></p>
            </section>
        </div>
    </main>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script src="{{ url_for('static', filename='app.js') }}?v=4"></script>
</body>
</html>
